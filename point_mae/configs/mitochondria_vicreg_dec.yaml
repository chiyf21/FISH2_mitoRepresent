seed: 42
split_seed: 42
data:
  feature_names: [intensity, gradient, distance, surface]
  val_fraction: 0.1
  test_fraction: 0.1
train:
  epochs: 10
  batch_size: 32
  lr: 0.00001
  weight_decay: 0.01
  grad_clip: 1.0
  amp: true
  num_workers: 4
objective:
  vicreg:
    lambda: 0.05
    invariance_weight: 25.0
    variance_weight: 25.0
    covariance_weight: 1.0
    gamma: 1.0
    eps: 0.000001
    hidden_dim: 384
    projection_dim: 32
    keep_ratio: 0.9
  cluster:
    lambda: 1.0
    warmup_epochs: 5
    update_every_epochs: 1
    alpha: 1.0
    kmeans_n_init: 20
    k_values: [5, 10, 20]
evaluation:
  representative_k: 10
  stability_samples: 128

