seed: 42
split_seed: 42
data:
  organelle_type: mitochondria
  feature_names: [intensity, gradient, distance, surface]
  spacing_zyx: [30.0, 8.0, 8.0]
  coord_scale_nm: 1000.0
  val_fraction: 0.1
  test_fraction: 0.1
model:
  preset: large
  num_groups: 64
  group_size: 32
  mask_ratio: 0.60
  embedding_dim: 128
  mlp_ratio: 4
  loss_weights: {geo: 1.0, intensity: 1.0, gradient: 1.0, distance: 1.0, surface: 1.0}
train:
  epochs: 100
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.05
  grad_clip: 1.0
  amp: true
  num_workers: 4
